version: "3.9"
services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: cfd_timescaledb_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cfd_system
    ports:
      - "5432:5432"
    volumes:
      - timescale_prod_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cfd_redis_prod
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  timescale_prod_data:
